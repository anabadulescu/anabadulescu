<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <style>
    .serif{font-family:'Bodoni Moda','Bodoni 72',Didot,'Playfair Display',Georgia,serif}
    .sans{font-family:'General Sans','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'Silkscreen','Pixelify Sans','Courier New',monospace}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes blink{50%{opacity:0}}
    .star{transform-origin:600px 210px;animation:spin 14s linear infinite}
    .cur{animation:blink 1.1s steps(1) infinite}
  </style>
  <rect width="1200" height="420" fill="#F3EFE7"/>
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#15131A" stroke-width="1.5"/>
  <line x1="24" y1="70" x2="1176" y2="70" stroke="#15131A" stroke-width="1"/>
  <line x1="24" y1="350" x2="1176" y2="350" stroke="#15131A" stroke-width="1"/>
  <text x="48" y="54" class="mono" font-size="14" fill="#15131A" letter-spacing="2">ISSUE Nº 01 — THE GITHUB EDITION</text>
  <text x="1152" y="54" class="mono" font-size="14" fill="#B42318" text-anchor="end" letter-spacing="2">PHOENIX · BUCHAREST · NICE</text>
  <text x="330" y="250" class="serif" font-size="190" font-style="italic" fill="#15131A" text-anchor="middle">A</text>
  <g class="star"><path d="M600 150 L612 198 L660 210 L612 222 L600 270 L588 222 L540 210 L588 198 Z" fill="#B42318"/></g>
  <text x="870" y="250" class="serif" font-size="190" font-style="italic" fill="#15131A" text-anchor="middle">B</text>
  <text x="600" y="318" class="serif" font-size="30" fill="#15131A" text-anchor="middle" letter-spacing="10">ANA BADULESCU</text>
  <text x="48" y="380" class="sans" font-size="15" fill="#15131A" letter-spacing="1.5">software engineer · founder · maker of pretty, useful things</text>
  <text x="1152" y="380" class="mono" font-size="14" fill="#15131A" text-anchor="end">building in private<tspan class="cur" fill="#B42318">_</tspan></text>
</svg>
